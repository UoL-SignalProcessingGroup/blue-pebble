name: Sync CITATION Metadata

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to sync, for example v0.2.0
        required: true
      release_date:
        description: Release date in YYYY-MM-DD format
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-citation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update CITATION.cff release metadata
        id: citation
        env:
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          RELEASE_DATE: ${{ github.event_name == 'release' && github.event.release.published_at || inputs.release_date }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          path = Path("CITATION.cff")
          text = path.read_text(encoding="utf-8")

          raw_tag = os.environ["TAG_NAME"].strip()
          raw_date = os.environ["RELEASE_DATE"].strip()

          version = raw_tag[1:] if raw_tag.startswith("v") else raw_tag
          release_date = raw_date[:10]

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Unsupported release tag format: {raw_tag!r}")

          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", release_date):
              raise SystemExit(f"Unsupported release date format: {raw_date!r}")

          version_line = f'version: "{version}"'
          date_line = f"date-released: {release_date}"

          if re.search(r'^version: ".*"$', text, flags=re.MULTILINE):
              text = re.sub(
                  r'^version: ".*"$',
                  version_line,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          else:
              text = text.replace('license: "MIT"\n', f'license: "MIT"\n\n{version_line}\n', 1)

          if re.search(r"^date-released: .*$", text, flags=re.MULTILINE):
              text = re.sub(
                  r"^date-released: .*$",
                  date_line,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          elif version_line in text:
              text = text.replace(f"{version_line}\n", f"{version_line}\n{date_line}\n", 1)
          else:
              raise SystemExit("Failed to insert date-released after version line.")

          path.write_text(text, encoding="utf-8")
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"release_date={release_date}\n")
          PY

      - name: Create pull request with updated CITATION.cff
        run: |
          if git diff --quiet -- CITATION.cff; then
            echo "CITATION.cff already up to date."
            exit 0
          fi

          branch="automation/sync-citation-v${{ steps.citation.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CITATION.cff
          git commit -m "docs(citation): sync release metadata"
          git push --force-with-lease origin "$branch"

          existing_pr="$(gh pr list --head "$branch" --base "${{ github.event.repository.default_branch }}" --state open --json number --jq '.[0].number')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing pull request #$existing_pr"
            exit 0
          fi

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "docs(citation): sync release metadata for v${{ steps.citation.outputs.version }}" \
            --body "Update \`CITATION.cff\` with the released software version \`${{ steps.citation.outputs.version }}\` and date \`${{ steps.citation.outputs.release_date }}\`."
        env:
          GH_TOKEN: ${{ github.token }}
