name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs the tags to resolve the version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .

      - name: Type check (Pyrefly)
        if: matrix.python-version == '3.12'
        run: |
          pyrefly check

      - name: Tests (Pytest)
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pytest --cov=bluepebble --cov-report=term-missing --cov-report=xml --cov-fail-under=55
          else
            pytest
          fi

      - name: Smoke import
        run: |
          python -c "import bluepebble; print(getattr(bluepebble, '__version__', 'no __version__'))"

      - name: Build (sdist/wheel)
        run: |
          python -m build --sdist --wheel

