name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .

      - name: Tests (Pytest)
        run: |
          pytest

      - name: Smoke import
        run: |
          python -c "import bluepebble; print(getattr(bluepebble, '__version__', 'no __version__'))"

      - name: Build (sdist/wheel)
        run: |
          python -m build --sdist --wheel

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (docs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs
        run: |
          cd docs
          make html

  notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Check notebook-related changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            notebooks:
              - 'docs/**/*.ipynb'
              - 'pyproject.toml'

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.notebooks == 'true'
        with:
          python-version: "3.12"

      - name: Validate notebook JSON
        if: steps.changes.outputs.notebooks == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("docs").rglob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No notebooks found under docs/")

          for path in notebooks:
              with path.open("r", encoding="utf-8") as stream:
                  json.load(stream)
              print(f"Validated {path}")
          PY

      - name: Skip notebook validation
        if: steps.changes.outputs.notebooks != 'true'
        run: |
          echo "No notebook-related changes detected."
