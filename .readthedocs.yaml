version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  jobs:
    # Read the Docs clones shallowly without tags, so setuptools_scm would report 0.1.devN.
    post_checkout:
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
