[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nereus"
dynamic = ["version"]
description = "A Stone Soup plugin for underwater acoustic tracking."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Joshua J Wakefield", email = "J.J.Wakefield@liverpool.ac.uk" },
    { name = "Fin Boulton", email = "F.Boulton@liverpool.ac.uk" },
]
license = { text = "MIT" }
keywords = ["nereus", "state estimation", "tracking", "sonar", "underwater-acoustics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "stonesoup>=1.8",
    "numba",
    "rocket-fft",
    "tqdm",
    "plotly"
]

[project.urls]
Repository = "https://github.com/jjwakefield/nereus"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "myst-nb"
]
examples = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

[tool.setuptools_scm]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "D", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/tutorials/*" = ["E402"]
"docs/examples/*" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
