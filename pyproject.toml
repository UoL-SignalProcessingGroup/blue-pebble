[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-pebble"
dynamic = ["version"]
description = "A Stone Soup plugin for underwater acoustic sensing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Joshua J Wakefield", email = "J.J.Wakefield@liverpool.ac.uk" },
    { name = "Fin Boulton", email = "F.Boulton@liverpool.ac.uk" },
]
maintainers = [
    { name = "Joshua J Wakefield", email = "J.J.Wakefield@liverpool.ac.uk" },
    { name = "Fin Boulton", email = "F.Boulton@liverpool.ac.uk" },
]
license = "MIT"
keywords = [
    "blue pebble",
    "underwater acoustics",
    "passive sonar",
    "beamforming",
    "detection",
    "tracking",
    "stone soup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "stonesoup>=1.8",
    "numba>=0.56",
    "rocket-fft>=0.3.1",
    "tqdm>=4.64",
    "plotly>=5",
    "dash>=4.0.0",
    "cmocean>=4.0.3",
    "netCDF4>=1.7.4",
]

[project.urls]
Repository = "https://github.com/UoL-SignalProcessingGroup/blue-pebble"
Documentation = "https://blue-pebble.readthedocs.io"
"Bug Tracker" = "https://github.com/UoL-SignalProcessingGroup/blue-pebble/issues"

[project.entry-points."stonesoup.plugins"]
bluepebble = "bluepebble"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "build",
    "pyright>=1.1.408",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-gallery>=0.15",
    "kaleido>=1.0.0",
]
examples = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

[tool.setuptools_scm]
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)(?:[-+].*)?$"

[tool.ruff]
line-length = 99
extend-exclude = ["external_tools"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "D", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/tutorials/*" = ["E402"]
"docs/examples/*" = ["E402"]
"docs/source/conf.py" = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["bluepebble"]
exclude = [
    ".venv",
    "tests",
    "docs",
    "external_tools",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
reportUnsupportedDunderAll = "none"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportOperatorIssue = "warning"
reportGeneralTypeIssues = "warning"

[[tool.pyright.executionEnvironments]]
root = "bluepebble/detector"
reportAssignmentType = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "bluepebble/models"
reportAssignmentType = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "bluepebble/platform"
reportAssignmentType = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "bluepebble/signal"
reportAssignmentType = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "bluepebble/sigproc"
reportAssignmentType = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "bluepebble/simulator"
reportAssignmentType = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "bluepebble/types"
reportAssignmentType = "none"
reportArgumentType = "none"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["docs*", "tests*", "external_tools*"]

[tool.coverage.run]
source = ["bluepebble"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = ["*/__init__.py"]
