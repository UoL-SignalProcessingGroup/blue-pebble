[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nereus"
dynamic = ["version"]
description = "A Stone Soup plugin for underwater acoustic sensing."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Joshua J Wakefield", email = "J.J.Wakefield@liverpool.ac.uk" },
    { name = "Fin Boulton", email = "F.Boulton@liverpool.ac.uk" },
]
license = { text = "MIT" }
keywords = [
    "nereus",
    "underwater acoustics",
    "passive sonar",
    "beamforming",
    "detection",
    "tracking",
    "stone soup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.17",
    "scipy",
    "stonesoup>=1.8",
    "numba",
    "rocket-fft",
    "tqdm",
    "plotly",
]

[project.urls]
Repository = "https://github.com/jjwakefield/nereus"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "build",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "myst-nb",
]
examples = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

[tool.setuptools_scm]
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)(?:[-+].*)?$"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "D", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/tutorials/*" = ["E402"]
"docs/examples/*" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]