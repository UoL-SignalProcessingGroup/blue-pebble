[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-pebble"
dynamic = ["version"]
description = "A Stone Soup plugin for underwater acoustic sensing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Joshua J Wakefield", email = "J.J.Wakefield@liverpool.ac.uk" },
    { name = "Fin Boulton", email = "F.Boulton@liverpool.ac.uk" },
]
maintainers = [
    { name = "Joshua J Wakefield", email = "J.J.Wakefield@liverpool.ac.uk" },
    { name = "Fin Boulton", email = "F.Boulton@liverpool.ac.uk" },
]
license = "MIT"
keywords = [
    "blue pebble",
    "underwater acoustics",
    "passive sonar",
    "beamforming",
    "detection",
    "tracking",
    "stone soup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "stonesoup>=1.8",
    "numba>=0.56",
    "rocket-fft>=0.3.1",
    "tqdm>=4.64",
    "plotly>=5",
    "dash>=4.0.0",
    "cmocean>=4.0.3",
    "netCDF4>=1.7.4",
    "gsw>=3.6",
    "rtrs>=0.2.3",
]

[project.urls]
Repository = "https://github.com/UoL-SignalProcessingGroup/blue-pebble"
Documentation = "https://blue-pebble.readthedocs.io"
"Bug Tracker" = "https://github.com/UoL-SignalProcessingGroup/blue-pebble/issues"

[project.entry-points."stonesoup.plugins"]
bluepebble = "bluepebble"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "build",
    "pyrefly>=1.4.0",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-gallery>=0.15",
    "kaleido>=1.0.0",
]
examples = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

[tool.setuptools_scm]
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)(?:[-+].*)?$"

[tool.ruff]
line-length = 99
extend-exclude = ["external_tools"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "D", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/tutorials/*" = ["E402"]
"docs/examples/*" = ["E402"]
"docs/source/conf.py" = ["E501"]

[tool.pyrefly]
project-includes = ["bluepebble"]
# stubs/ holds a partial stub for stonesoup.base, so `x: int = Property(...)` type-checks.
search-path = ["stubs", "."]
python-version = "3.11"
preset = "default"

[tool.pyrefly.errors]
# scipy and tqdm ship no stubs, and most int()/bool() calls deliberately coerce unvalidated
# Stone Soup Property values.
untyped-import = "ignore"
unnecessary-type-conversion = "ignore"

# Warnings rather than errors until biological.py is overhauled; drop this once it is.
[[tool.pyrefly.sub-config]]
matches = "bluepebble/signal/biological.py"

[tool.pyrefly.sub-config.errors]
bad-argument-type = "warn"
bad-override = "warn"
bad-return = "warn"
bad-unpacking = "warn"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
# "build*" keeps a stale local build/lib tree out of the wheel. Package discovery walks the
# filesystem rather than the git index, so a developer with leftover build output otherwise
# ships nested copies of the whole package inside their wheel.
exclude = ["docs*", "tests*", "external_tools*", "build*", "stubs*"]

[tool.coverage.run]
source = ["bluepebble"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = ["*/__init__.py"]
